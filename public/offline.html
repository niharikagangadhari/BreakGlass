<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070C1E" />
    <title>Break Glass — Offline</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: #070c1e;
            color: #f1f5f9;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .card {
            max-width: 30rem;
            text-align: center;
            border: 1px solid #1c2541;
            background: #0b132b;
            border-radius: 0.75rem;
            padding: 2.5rem 2rem;
        }

        h1 {
            font-size: 1.25rem;
            margin: 1.25rem 0 0.5rem;
        }

        p {
            color: #94a3b8;
            font-size: 0.9rem;
            line-height: 1.6;
            margin: 0 0 1.5rem;
        }

        code {
            font-family: "JetBrains Mono", Menlo, Monaco, "Courier New", monospace;
            font-size: 0.75rem;
            color: #d97706;
        }

        button {
            border: 0;
            background: #dc2626;
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.6rem 1.25rem;
            border-radius: 0.5rem;
            cursor: pointer;
        }

        button:hover {
            background: #b91c1c;
        }

        .dot {
            display: inline-block;
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 999px;
            background: #d97706;
            margin-right: 0.4rem;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="/icons/pwa-192x192.png" alt="" width="72" height="72" />
        <h1>Break Glass is not cached yet</h1>
        <p>
            <span class="dot"></span><code>OFFLINE</code><br /><br />
            This page appears only when the application shell has not been stored on
            this device yet. Connect once so the service worker can cache the app,
            after which Break Glass runs entirely offline.
        </p>
        <button onclick="location.reload()">Retry</button>
    </div>
</body>

</html>
